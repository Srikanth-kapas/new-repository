<!DOCTYPE html>
<html>
<head>
<title>Table Example</title>
</head>
<body>

<table border="1">
  <caption>Student Details</caption>

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Course</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>101</td>
      <td>Srikanth</td>
      <td>React</td>
    </tr>

    <tr>
      <td>102</td>
      <td>Ravi</td>
      <td>Java</td>
    </tr>
  </tbody>

</table>

</body>
</html>
